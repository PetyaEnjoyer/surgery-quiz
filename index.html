<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест по оперативной хирургии</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1b1d21; --muted: #6b7280; --line: #e3e6ea;
    --accent: #2f6fde; --ok: #1f9d55; --ok-bg: #e5f6ec; --bad: #d64545; --bad-bg: #fbe9e9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --card: #1c1f24; --text: #e7e9ec; --muted: #9aa1ab; --line: #2c3037;
      --accent: #5b8ff0; --ok: #3ccf7a; --ok-bg: #173324; --bad: #f06b6b; --bad-bg: #3a1c1c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 16px 16px 96px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .muted { color: var(--muted); font-size: 15px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 14px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 10px 0 4px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .2s; }
  .top { display: flex; justify-content: space-between; font-size: 15px; color: var(--muted); }
  .q { font-size: 19px; font-weight: 600; margin: 0 0 14px; }
  .opt {
    display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
    padding: 13px 14px; margin: 8px 0; border: 1.5px solid var(--line); border-radius: 11px;
    background: transparent; color: inherit; font: inherit; cursor: pointer;
  }
  .opt .box {
    flex: none; width: 22px; height: 22px; margin-top: 1px; border: 2px solid var(--muted);
    border-radius: 6px; display: grid; place-items: center; font-size: 14px; font-weight: 700;
  }
  .opt.sel { border-color: var(--accent); }
  .opt.sel .box { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt.ok { border-color: var(--ok); background: var(--ok-bg); }
  .opt.ok .box { border-color: var(--ok); color: var(--ok); }
  .opt.bad { border-color: var(--bad); background: var(--bad-bg); }
  .opt.bad .box { border-color: var(--bad); color: var(--bad); background: transparent; }
  .opt.ok.sel .box { background: var(--ok); color: #fff; }
  .opt:disabled, div.opt { cursor: default; }
  h2 { font-size: 19px; margin: 28px 0 0; }
  .review .verdict { margin-bottom: 4px; }
  .verdict { font-weight: 600; margin-top: 10px; }
  .verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
  .actions {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--line);
  }
  .actions > div { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; }
  .btn {
    flex: 1; padding: 14px; border: 0; border-radius: 11px; background: var(--accent); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn.sec { background: var(--line); color: var(--text); flex: none; }
  .btn:disabled { opacity: .45; cursor: default; }
  .big { font-size: 44px; font-weight: 700; margin: 6px 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<main id="app"><p class="muted">Загрузка…</p></main>
<div class="actions hidden" id="actions"><div></div></div>

<script>
const N = 100;
const KEY = "surgery-quiz-v1";
let all = [], st = null;

const app = document.getElementById("app");
const actions = document.getElementById("actions");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} }
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function sample(n) { return shuffle(all.map((_, i) => i)).slice(0, n); }

// option display order, indices into q.options
function newOrder() { st.order = shuffle(all[st.ids[st.pos]].options.map((_, i) => i)); }

function start() {
  st = { ids: sample(Math.min(N, all.length)), pos: 0, sel: [], answered: false, score: 0 };
  newOrder(); save(); render();
}

function setActions(html) {
  actions.classList.toggle("hidden", !html);
  actions.firstElementChild.innerHTML = html || "";
}

function renderStart() {
  const saved = load();
  const resume = saved && saved.ids && saved.pos < saved.ids.length;
  const done = saved && saved.ids && saved.pos >= saved.ids.length;
  app.innerHTML = `
    <h1>Оперативная хирургия</h1>
    <p class="muted">${all.length} вопросов в базе, в тесте ${Math.min(N, all.length)} случайных.
    Правильных вариантов может быть несколько. Правильный ответ показывается сразу после ответа.</p>
    ${resume ? `<div class="card">Есть незаконченный тест: вопрос ${saved.pos + 1} из ${saved.ids.length},
      правильно ${saved.score}.</div>` : ""}
    ${done ? `<div class="card">Прошлый тест: ${saved.score} / ${saved.ids.length}.</div>` : ""}`;
  setActions(resume
    ? `<button class="btn sec" onclick="start()">Новый</button><button class="btn" onclick="resume()">Продолжить</button>`
    : done
      ? `<button class="btn sec" onclick="resume()">Обзор</button><button class="btn" onclick="start()">Начать тест</button>`
      : `<button class="btn" onclick="start()">Начать тест</button>`);
}

function resume() { st = load(); render(); }

function isRight(q, sel) {
  return sel.length === q.correct.length && sel.every(i => q.correct.includes(i));
}

const letter = pos => String.fromCharCode(97 + pos);

// review renders static rows instead of buttons
function optionsHtml(q, order, sel, answered, review) {
  return order.map((i, pos) => {
    let cls = sel.includes(i) ? "sel" : "";
    let mark = sel.includes(i) ? "✓" : "";
    if (answered) {
      if (q.correct.includes(i)) { cls += " ok"; mark = "✓"; }
      else if (sel.includes(i)) { cls += " bad"; mark = "✕"; }
    }
    const inner = `<span class="box">${mark}</span><span>${letter(pos)}. ${esc(q.options[i])}</span>`;
    return review
      ? `<div class="opt ${cls}" data-i="${i}">${inner}</div>`
      : `<button class="opt ${cls}" data-i="${i}" ${answered ? "disabled" : ""} onclick="toggle(${i})">${inner}</button>`;
  }).join("");
}

function renderQuestion() {
  const q = all[st.ids[st.pos]];
  const total = st.ids.length;
  if (!st.order || st.order.length !== q.options.length) { newOrder(); save(); }
  const opts = optionsHtml(q, st.order, st.sel, st.answered, false);
  const right = st.answered && isRight(q, st.sel);
  app.innerHTML = `
    <div class="top"><span>Вопрос ${st.pos + 1} из ${total}</span><span>Правильно: ${st.score}</span></div>
    <div class="bar"><div style="width:${(st.pos + st.answered) / total * 100}%"></div></div>
    <div class="card">
      <p class="q">${esc(q.q)}</p>
      ${opts}
      ${st.answered ? `<div class="verdict ${right ? "ok" : "bad"}">${right ? "Верно" : "Неверно"}</div>` : ""}
    </div>`;
  setActions(st.answered
    ? `<button class="btn" onclick="next()">${st.pos + 1 < total ? "Далее" : "Результат"}</button>`
    : `<button class="btn" ${st.sel.length ? "" : "disabled"} onclick="answer()">Ответить</button>`);
}

function renderResult() {
  const total = st.ids.length;
  app.innerHTML = `
    <h1>Тест завершён</h1>
    <div class="card"><div class="big">${st.score} / ${total}</div>
    <div class="muted">${Math.round(st.score / total * 100)}% правильных ответов</div></div>
    ${reviewHtml()}`;
  setActions(`<button class="btn" onclick="start()">Пройти ещё раз</button>`);
}

function reviewHtml() {
  const log = st.log || [];
  if (!log.length) return "";
  const letters = (order, idx) => order.map((i, pos) => idx.includes(i) ? letter(pos) : null).filter(Boolean).join(", ");
  return `<h2>Обзор ответов</h2>` + log.map((a, n) => {
    const q = all[a.id];
    const right = isRight(q, a.sel);
    return `<div class="card review">
      <p class="q">${n + 1}. ${esc(q.q)}</p>
      ${optionsHtml(q, a.order, a.sel, true, true)}
      <div class="verdict ${right ? "ok" : "bad"}">${right ? "Верно" : "Неверно"}</div>
      <div class="muted">Ваш ответ: ${letters(a.order, a.sel)} · Правильный: ${letters(a.order, q.correct)}</div>
    </div>`;
  }).join("");
}

function toggle(i) {
  if (st.answered) return;
  st.sel = st.sel.includes(i) ? st.sel.filter(x => x !== i) : [...st.sel, i];
  save(); render();
}

function answer() {
  if (!st.sel.length) return;
  st.answered = true;
  if (isRight(all[st.ids[st.pos]], st.sel)) st.score++;
  st.log = [...(st.log || []), { id: st.ids[st.pos], order: st.order, sel: st.sel }];
  save(); render();
}

function next() {
  st.pos++; st.sel = []; st.answered = false;
  if (st.pos < st.ids.length) newOrder();
  save(); render(); window.scrollTo(0, 0);
}

function render() {
  if (!st) return renderStart();
  if (st.pos >= st.ids.length) return renderResult();
  renderQuestion();
}

fetch("questions.json")
  .then(r => r.json())
  .then(d => { all = d; render(); })
  .catch(() => { app.innerHTML = `<p class="muted">Не удалось загрузить вопросы. Обновите страницу.</p>`; });
</script>
</body>
</html>
